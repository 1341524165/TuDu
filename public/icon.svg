<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    
    <!-- Accent Checkmark Gradient -->
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    
    <!-- Outer Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Box Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Subtle Inner Ring -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="2" />

  <!-- Glowing Accent Shape behind Checkmark (Subtle backdrop glow) -->
  <circle cx="256" cy="256" r="120" fill="#8b5cf6" opacity="0.15" filter="url(#glow)" />

  <!-- Minimalist Premium Checklist Graphic -->
  <g filter="url(#glow)">
    <!-- Checklist Base Ring -->
    <circle cx="256" cy="256" r="140" fill="none" stroke="url(#checkGrad)" stroke-width="24" stroke-linecap="round" opacity="0.9" />
    
    <!-- Glowing Premium Checkmark -->
    <path d="M190 260 L235 305 L325 190" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
